<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northstar Trading — MCP Demo</title>
  <style>
    :root {
      --bg: #0b1020; --card: #151c2e; --accent: #6366f1;
      --text: #e8edf7; --muted: #94a3b8; --ok: #22c55e; --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e1b4b 0%, transparent 50%),
                  radial-gradient(900px 500px at 100% 0%, #0e7490 0%, transparent 40%), var(--bg);
      color: var(--text); min-height: 100vh;
    }
    header { padding: 2rem 1.5rem 1rem; text-align: center; }
    header h1 { margin: 0; font-size: 2rem; }
    header p { color: var(--muted); margin: 0.4rem 0 0; }
    .status { display: inline-block; margin-top: 0.8rem; padding: 0.25rem 0.7rem; border-radius: 999px; font-size: 0.8rem; background: #1e293b; }
    .status.ok { color: var(--ok); } .status.err { color: var(--err); }
    .container { max-width: 1100px; margin: 0 auto; padding: 1rem 1.2rem 3rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .card { background: var(--card); border: 1px solid #243049; border-radius: 14px; padding: 1.1rem; }
    .card h3 { margin: 0 0 0.3rem; font-size: 1.05rem; }
    .card .desc { color: var(--muted); font-size: 0.88rem; margin: 0 0 0.7rem; min-height: 2.4em; }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 0.45rem; }
    input, textarea { width: 100%; margin-top: 0.2rem; padding: 0.45rem 0.55rem; border-radius: 8px; border: 1px solid #334155; background: #0b1020; color: var(--text); }
    button { margin-top: 0.75rem; background: linear-gradient(90deg, var(--accent), #4f46e5); color: white; border: 0; padding: 0.5rem 0.9rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
    #log { margin-top: 1.4rem; background: #070b14; border: 1px solid #243049; border-radius: 12px; padding: 1rem; min-height: 140px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.82rem; }
    footer { text-align: center; color: var(--muted); font-size: 0.78rem; padding-bottom: 2rem; }
    .badge { font-size: 0.68rem; padding: 0.1rem 0.4rem; border-radius: 4px; background: #1e3a5f; color: #93c5fd; margin-left: 0.35rem; }
  </style>
</head>
<body>
  <header>
    <h1>Northstar Trading</h1>
    <p>Live MCP client · Streamable HTTP · synthetic data</p>
    <div id="status" class="status">Connecting to MCP…</div>
  </header>
  <div class="container">
    <div id="tools" class="grid"></div>
    <div id="log">MCP responses appear here…</div>
  </div>
  <footer>This page talks to <code>/mcp</code> using the MCP protocol.</footer>

  <script>
    const BASE = "https://business-mcp-server.onrender.com";
    const MCP_URL = BASE + "/mcp";
    const TOKEN = "4klavMQ-0u-K-soF9BfpNzKQvtmP7ndIdp3e5ruFKj0";

    const EXAMPLES = {
      query: "Customer",
      limit: "5",
      order_id: "1",
      sku: "SKU-001",
      start_date: "2026-01-01",
      end_date: "2026-01-31",
      customer_id: "1",
      quantity: "2",
      request_id: "demo-" + Date.now(),
      subject: "Demo ticket",
      description: "Created from the MCP demo page.",
      items: '[{"sku":"SKU-001","quantity":1}]'
    };

    const statusEl = document.getElementById("status");
    const toolsEl = document.getElementById("tools");
    const logEl = document.getElementById("log");
    let sessionId = null, nextId = 1;

    function pretty(result) {
      if (!result) return String(result);
      if (result.isError || result.is_error) return "Error:\n" + JSON.stringify(result, null, 2);
      const blocks = result.content || [];
      const texts = blocks.map(b => b.text || "").filter(Boolean);
      if (!texts.length) return JSON.stringify(result, null, 2);
      const parsed = texts.map(t => { try { return JSON.parse(t); } catch { return t; } });
      return JSON.stringify(parsed.length === 1 ? parsed[0] : parsed, null, 2);
    }

    function log(obj) {
      logEl.textContent = typeof obj === "string" ? obj : pretty(obj);
    }

    async function mcp(method, params) {
      const body = { jsonrpc: "2.0", id: nextId++, method, params: params || {} };
      const headers = { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" };
      if (sessionId) headers["Mcp-Session-Id"] = sessionId;
      const res = await fetch(MCP_URL, { method: "POST", headers, body: JSON.stringify(body) });
      const sid = res.headers.get("Mcp-Session-Id");
      if (sid) sessionId = sid;
      const text = await res.text();
      let data;
      if (text.includes("data:")) {
        const line = text.split("\n").find(l => l.startsWith("data:"));
        data = line ? JSON.parse(line.slice(5).trim()) : { raw: text };
      } else {
        try { data = JSON.parse(text); } catch { data = { raw: text }; }
      }
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return data.result ?? data;
    }

    async function connect() {
      try {
        await mcp("initialize", {
          protocolVersion: "2025-03-26",
          capabilities: {},
          clientInfo: { name: "northstar-demo-page", version: "1.0" }
        });
        fetch(MCP_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream", ...(sessionId ? { "Mcp-Session-Id": sessionId } : {}) },
          body: JSON.stringify({ jsonrpc: "2.0", method: "notifications/initialized" })
        }).catch(() => {});
        const listed = await mcp("tools/list", {});
        renderTools(listed.tools || []);
        statusEl.textContent = "Connected to MCP · " + (listed.tools || []).length + " tools";
        statusEl.className = "status ok";
      } catch (e) {
        statusEl.textContent = "MCP connection failed: " + e.message;
        statusEl.className = "status err";
        log("Failed to connect to " + MCP_URL + "\n" + e.message);
      }
    }

    function renderTools(tools) {
      toolsEl.innerHTML = "";
      for (const tool of tools) {
        const card = document.createElement("div");
        card.className = "card";
        const props = (tool.inputSchema || {}).properties || {};
        const required = new Set((tool.inputSchema || {}).required || []);
        let fields = "";
        for (const [name, def] of Object.entries(props)) {
          if (name === "token") continue;
          const example = EXAMPLES[name] ?? def.default ?? "";
          const label = name + (required.has(name) ? " *" : "");
          if (name === "items" || name === "description") {
            fields += `<label>${label}<textarea data-arg="${name}" rows="2">${example}</textarea></label>`;
          } else if (def.type === "integer" || def.type === "number") {
            fields += `<label>${label}<input data-arg="${name}" type="number" value="${example}" /></label>`;
          } else {
            fields += `<label>${label}<input data-arg="${name}" value="${example}" /></label>`;
          }
        }
        card.innerHTML = `<h3>${tool.name} <span class="badge">mcp</span></h3><p class="desc">${tool.description || ""}</p>${fields}<button>Call tool</button>`;
        card.querySelector("button").onclick = () => callTool(tool.name, card);
        toolsEl.appendChild(card);
      }
    }

    async function callTool(name, card) {
      const args = { token: TOKEN };
      for (const el of card.querySelectorAll("[data-arg]")) {
        const key = el.dataset.arg;
        let val = el.value;
        if (el.type === "number") val = Number(val);
        if (key === "items") { try { val = JSON.parse(val); } catch {} }
        if (val !== "" && val !== undefined) args[key] = val;
      }
      log("Calling " + name + "…");
      try { log(await mcp("tools/call", { name, arguments: args })); }
      catch (e) { log("Error: " + e.message); }
    }

    connect();
  </script>
</body>
</html>
